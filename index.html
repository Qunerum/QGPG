<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Stats Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card" id="statsCard">
        <div class="card-header" id="headerSection">
            <img id="userAvatar" src="" alt="Avatar" class="avatar">
            <div>
                <h2 id="userName">Ładowanie...</h2>
                <p id="userLogin">@...</p>
            </div>
        </div>

        <div class="card-body">
            <p id="repoRow">📦 Publiczne repozytoria: <span id="repoCount">-</span></p>
            <p id="followersRow">👥 Obserwujący: <span id="followersCount">-</span></p>
            <p id="followingRow">👤 Obserwowani: <span id="followingCount">-</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
