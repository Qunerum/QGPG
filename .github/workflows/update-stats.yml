name: Aktualizuj Statystyki GitHub

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Uruchom generator
        run: node generate.js

      - name: Zapisz zmiany w repozytorium
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatyczna aktualizacja statystyk SVG [skip ci]"
          file_pattern: stats.svg
